<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farm Sook - Hybrid V62</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, updateDoc, deleteDoc, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDWi5aJTt4fhY6eHgup0IFzq8maOc30cZI",
      authDomain: "farm-cce21.firebaseapp.com",
      projectId: "farm-cce21",
      storageBucket: "farm-cce21.firebasestorage.app",
      messagingSenderId: "526312096943",
      appId: "1:526312096943:web:7cf1951ff11a0c5743c05a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // ฟังก์ชันบันทึกไข่ใหม่
    window.saveEgg = async (event) => {
      event.preventDefault();
      const pairName = document.getElementById('pairName').value;
      const eggNo = document.getElementById('eggNo').value;
      const layDate = document.getElementById('layDate').value;
      const estHatchDate = document.getElementById('estHatchDate').value;
      const status = document.getElementById('eggStatus').value;

      try {
        await addDoc(collection(db, "egg_details"), {
          pairName, eggNo: Number(eggNo), layDate, estHatchDate, status
        });
        alert("✅ บันทึกข้อมูลไข่สำเร็จ!");
        document.getElementById('eggForm').reset();
      } catch (err) {
        alert("❌ Error: " + err.message);
      }
    };

    window.quickUpdateEggStatus = async (eggId, newStatus) => {
      try {
        await updateDoc(doc(db, "egg_details", eggId), { status: newStatus });
      } catch (err) { alert("Error: " + err.message); }
    };

    window.deleteEgg = async (id, no, group) => {
      if (confirm(`ต้องการลบไข่ใบที่ ${no} ใน ${group}?`)) {
        try { await deleteDoc(doc(db, "egg_details", id)); } catch (err) { alert("Error: " + err.message); }
      }
    };

    onSnapshot(collection(db, "egg_details"), (snapshot) => {
      const list = document.getElementById('egg-details-list');
      const reminderList = document.getElementById('reminder-list');
      if (list) list.innerHTML = "";
      if (reminderList) reminderList.innerHTML = "";
      
      let totalEggs = 0, totalHatched = 0;
      const groupedEggs = {};

      snapshot.forEach(docSnap => {
        const data = { id: docSnap.id, ...docSnap.data() };
        totalEggs++;
        if (data.status === 'ฟักแล้ว') totalHatched++;

        if (data.status === 'รอส่องเชื้อ' && reminderList) {
          reminderList.innerHTML += `
            <div class="p-3 bg-amber-50 rounded-2xl border border-amber-200 text-xs mb-2">
              <div class="font-bold mb-1">🔦 ส่องเชื้อ: ${data.pairName || data.cage || 'กรง'} (ใบที่ ${data.eggNo})</div>
              <div class="flex space-x-1">
                <button onclick="quickUpdateEggStatus('${data.id}', 'มีเชื้อ')" class="flex-1 bg-emerald-600 text-white py-1 rounded-lg">มีเชื้อ</button>
                <button onclick="quickUpdateEggStatus('${data.id}', 'ไม่มีเชื้อ')" class="flex-1 bg-rose-600 text-white py-1 rounded-lg">ไม่มีเชื้อ</button>
              </div>
            </div>`;
        }

        const groupKey = data.pairName || data.cage || 'กรง';
        if (!groupedEggs[groupKey]) groupedEggs[groupKey] = [];
        groupedEggs[groupKey].push(data);
      });

      for (const groupKey in groupedEggs) {
        const eggsHtml = groupedEggs[groupKey].sort((a,b) => a.eggNo - b.eggNo).map(egg => `
          <div class="p-3 bg-slate-50 rounded-2xl border border-slate-100 flex justify-between items-center text-xs mb-2">
            <div>
              <span class="font-black text-amber-900">🥚 ใบที่ ${egg.eggNo}</span>
              <div class="text-[10px] text-slate-500">ไข่: ${egg.layDate} | คาดการณ์ฟัก: ${egg.estHatchDate}</div>
            </div>
            <div class="flex items-center space-x-2">
              <span class="px-2 py-1 rounded-lg text-[9px] font-bold bg-white border">${egg.status}</span>
              <button onclick="deleteEgg('${egg.id}', '${egg.eggNo}', '${groupKey}')" class="text-rose-500">🗑️</button>
            </div>
          </div>`).join('');

        if (list) {
          list.innerHTML += `<div class="bg-white p-4 rounded-3xl border mb-4 shadow-sm"><div class="font-black text-sm mb-3">🪺 ${groupKey}</div>${eggsHtml}</div>`;
        }
      }
      
      document.getElementById('total-eggs').innerText = totalEggs + " ใบ";
      document.getElementById('total-chicks').innerText = totalHatched + " ตัว";
    });
  </script>
</head>
<body class="bg-slate-50 p-4">
  <div class="max-w-md mx-auto space-y-4">
    <h1 class="text-lg font-black text-slate-800 text-center">🐣 Farm Sook Tracker</h1>
    
    <!-- Stats -->
    <div class="grid grid-cols-2 gap-3">
      <div class="bg-white p-4 rounded-3xl border text-center shadow-sm"><p class="text-[10px] text-slate-400">ไข่รวม</p><h3 id="total-eggs" class="font-black">0 ใบ</h3></div>
      <div class="bg-white p-4 rounded-3xl border text-center shadow-sm"><p class="text-[10px] text-slate-400">ฟักแล้ว</p><h3 id="total-chicks" class="font-black">0 ตัว</h3></div>
    </div>

    <!-- ฟอร์มบันทึกข้อมูลไข่ -->
    <div class="bg-white p-4 rounded-3xl border shadow-sm space-y-3">
      <h3 class="text-sm font-black text-slate-800">➕ บันทึกไข่ใหม่</h3>
      <form id="eggForm" onsubmit="saveEgg(event)" class="space-y-2 text-xs">
        <input type="text" id="pairName" placeholder="ชื่อคู่พ่อแม่พันธุ์ / กรง" required class="w-full p-2.5 rounded-xl border bg-slate-50">
        <input type="number" id="eggNo" placeholder="ไข่ใบที่ (เช่น 1, 2)" required class="w-full p-2.5 rounded-xl border bg-slate-50">
        <div>
          <label class="text-[10px] text-slate-400">วันที่ไข่</label>
          <input type="date" id="layDate" required class="w-full p-2.5 rounded-xl border bg-slate-50">
        </div>
        <div>
          <label class="text-[10px] text-slate-400">คาดการณ์วันฟัก</label>
          <input type="date" id="estHatchDate" required class="w-full p-2.5 rounded-xl border bg-slate-50">
        </div>
        <select id="eggStatus" class="w-full p-2.5 rounded-xl border bg-slate-50">
          <option value="รอส่องเชื้อ">รอส่องเชื้อ</option>
          <option value="มีเชื้อ">มีเชื้อ</option>
          <option value="ไม่มีเชื้อ">ไม่มีเชื้อ</option>
          <option value="ฟักแล้ว">ฟักแล้ว</option>
        </select>
        <button type="submit" class="w-full bg-emerald-700 text-white py-2.5 rounded-xl font-bold shadow-md">บันทึกข้อมูลไข่</button>
      </form>
    </div>
    
    <!-- Reminders -->
    <h3 class="text-sm font-black text-slate-800">⏰ การแจ้งเตือนด่วน</h3>
    <div id="reminder-list"></div>
    
    <!-- Eggs Table -->
    <h3 class="text-sm font-black text-slate-800">🪺 ตารางติดตามการไข่</h3>
    <div id="egg-details-list"></div>
  </div>
</body>
</html>
